name: desktop

# Builds the Windows installer on a machine that is not the developer's --
# the closest CI gets to the PRD's foreign-machine test. The artifact it
# uploads is deliberately UNSIGNED and is NOT the release asset (that is
# built and uploaded locally); this run proves a clean checkout can
# produce one at all.
#
# There is intentionally NO macOS job: the Logisim bundle spec carries no
# mac JDK, no baseline in this project has ever been measured on macOS,
# and a job that fails on every release is an email that means nothing.
# Adding macOS starts with desktop/logisim-bundle.json, on a real Mac.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Fetch the pinned Logisim bundle
        shell: pwsh
        # Downloads the 4.1.0 release JAR and a Temurin 21 JDK against the
        # sha256 pins in desktop/logisim-bundle.json, jlinks the runtime,
        # and refuses to report success until the bundle EVALUATES a real
        # student-drawn circuit.
        run: ./desktop/fetch-logisim.ps1

      - name: Build the verified Python backend for this operating system
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[web,llm]" -r desktop/requirements-build.txt
          ./desktop/build-backend.ps1

      - name: Build the React app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build the desktop installer
        working-directory: desktop
        env:
          # CI artefacts are deliberately UNSIGNED. Signing happens only when
          # Apple/Windows credentials are intentionally supplied for a release.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run package:win

      - uses: actions/upload-artifact@v4
        with:
          name: Ohmwork-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
