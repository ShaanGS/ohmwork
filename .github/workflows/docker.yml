# Build the deployment image on every push.
#
# The Dockerfile is the one artefact in this repo that cannot be checked by
# the test suite, and it was written on a machine with no Docker installed.
# Without this workflow its first real run would be a deploy to a live Space,
# which is the worst place to discover a wrong base image or a moved download
# URL. So the image is BUILT here, and a build failure is a red commit rather
# than a broken site.
#
# It deliberately does not push anywhere. Deployment stays a deliberate act
# (deploy/push-space.sh), because a deploy carries secrets and a build does
# not.

name: docker

on:
  push:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "ohmwork/**"
      - "web/**"
      - ".github/workflows/docker.yml"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t ohmwork:ci .

      - name: The evaluator must actually run inside it
        # Not "does the image build" -- does the thing the whole service
        # depends on work in there. Logisim is Java, driven headless under
        # xvfb, and both halves of that are assumptions until something runs
        # them.
        #
        # NO `|| true` ON THE xvfb-run ITSELF, and that matters: it used to
        # have one, and that is how this step passed over an image that could
        # not start at all. `xvfb-run` was failing with "xauth command not
        # found", the `|| true` swallowed it, and only `java -version` had to
        # succeed. A check written so that its interesting half cannot fail
        # is not a check. Logisim's own exit code is still not trusted -- it
        # comes back empty on a successful run -- so what is asserted is that
        # xvfb-run runs something, and that the jar downloaded.
        run: |
          docker run --rm --entrypoint sh ohmwork:ci -c 'xvfb-run -a java -version'
          docker run --rm --entrypoint sh ohmwork:ci -c 'test -s "$OHMWORK_LOGISIM"'
          docker run --rm --entrypoint sh ohmwork:ci -c \
            'xvfb-run -a java -jar "$OHMWORK_LOGISIM" --version 2>&1 | head -5 || true'

      - name: The server must say something when it starts
        # A container that is UP, bound to nothing, and silent in `docker
        # logs` is the hardest failure to diagnose there is -- and it is what
        # the second build produced. Running the server in the FOREGROUND for
        # a few seconds puts whatever it says on screen, whether that is a
        # uvicorn banner or a traceback, before anything depends on it.
        run: |
          docker run --rm -e OHMWORK_PASSWORD=ci-only-password \
            --entrypoint sh ohmwork:ci -c \
            'timeout 20 /usr/local/bin/ohmwork-entrypoint 2>&1 | head -20; exit 0'

      - name: It must serve, refuse anonymous solves, and stay up
        # THE LOGS ARE PRINTED WHATEVER HAPPENS, and that is the point. The
        # first real run of this workflow caught the container dying at
        # startup and then reported eighty seconds of "connection refused" --
        # true, and it never said why, because `docker logs` sat after the
        # command that failed. A check that catches a broken image but cannot
        # say what broke is half a check.
        run: |
          docker run -d --name ohmwork -p 7860:7860 \
            -e OHMWORK_PASSWORD=ci-only-password \
            ohmwork:ci
          served=""
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:7860/api/health; then served=1; break; fi
            # Stop the moment it is gone: a container that has exited will
            # never answer, and forty more identical errors bury the reason.
            if [ -z "$(docker ps -q --filter name=ohmwork)" ]; then
              echo "the container exited before it served anything"; break
            fi
            sleep 2
          done
          echo
          echo "===== container logs ====="
          docker logs ohmwork 2>&1 || true
          echo "========================="
          if [ -z "$served" ]; then
            docker rm -f ohmwork >/dev/null 2>&1 || true
            echo "/api/health never answered"; exit 1
          fi
          # A solve without a session must be refused. This is the check that
          # matters most in a container that will hold real API keys.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                 -H 'Content-Type: application/json' \
                 -d '{"question":"design a 2-to-4 decoder"}' \
                 http://127.0.0.1:7860/api/solve || true)
          docker rm -f ohmwork >/dev/null 2>&1 || true
          test "$code" = "401" || { echo "anonymous solve returned $code"; exit 1; }

      - name: The PAGE must be served, not only the API
        # The built page lives beside the INSTALLED package, and this repo is
        # developed with an editable install -- where that path happens to be
        # the source tree, so a wrong lookup works perfectly on a laptop and
        # fails only inside an image. Checking the API alone would never find
        # it, and the symptom on a live Space is a blank white screen.
        run: |
          docker run -d --name ohmwork-page -p 7861:7860 \
            -e OHMWORK_PASSWORD=ci-only-password \
            ohmwork:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:7861/api/health; then break; fi
            sleep 2
          done
          body=$(curl -fsS http://127.0.0.1:7861/ || true)
          docker rm -f ohmwork-page >/dev/null 2>&1 || true
          echo "$body" | head -3
          echo "$body" | grep -q 'id="root"' || {
            echo "the built page was not served"; exit 1; }

      - name: A container with no password must REFUSE to start
        # Fail closed. The one misconfiguration whose symptom is everything
        # working perfectly, for everyone, on somebody else's free-tier keys.
        run: |
          if docker run --rm ohmwork:ci 2>&1 | tee /tmp/out; then
            echo "it started without a password"; exit 1
          fi
          grep -q "OHMWORK_PASSWORD" /tmp/out
