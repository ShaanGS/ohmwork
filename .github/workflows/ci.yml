# CI runs on Linux, where NEITHER simulator exists: LTspice is a Windows GUI
# application and Logisim Evolution is not installed here. So be precise about
# what a green tick on this workflow means.
#
# It DOES check: the schema gate, the device policy, both emitters, the .asc
# geometric parser and round trip, the analysis plan, prose resolution and
# staleness, the manifest contract, and that every published library entry
# still validates against its own sha256.
#
# It does NOT check any measured number. Every test that needs a simulator
# skips. That is by design and it is the reason for `-rs` below: pytest prints
# a one-line reason for every skip, so the log SAYS what was not examined
# rather than reporting a quiet pass over an unrun check. about 30 of 870 tests skip
# here; the same suite on a machine with the simulators skips 2.
#
# TO REHEARSE THIS LOCALLY ON WINDOWS, clear all THREE things a Linux runner
# lacks -- the third one cost a red first build:
#
#   env -u LOCALAPPDATA OHMWORK_LTSPICE=/x OHMWORK_LOGISIM=/x OHMWORK_LTSPICE_LIB=/x python -m pytest -q -rs
#
# Overriding the two executable variables is NOT enough. LTspice's component
# libraries are found under %LOCALAPPDATA% regardless of them, so a rehearsal
# that leaves it set is still using the real device library and passes 47
# tests that cannot run on the runner. See tests/conftest.py.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Fixtures are evidence, including their line endings, which
        # .gitattributes protects with -text. Checkout must not undo that.
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]"
          pip install pytest

      - name: Run the suite, printing every skip reason
        run: python -m pytest -q -rs
